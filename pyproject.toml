[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stuff-video-factory"
version = "0.1.0"
description = "Script in, vertical 9:16 educational video out: planner, Chatterbox voice, Blender 2.5D scenes, captions, SFX, FFmpeg compose."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10.0", "soundfile>=0.12"]

[project.optional-dependencies]
tts = ["chatterbox-tts==0.1.7", "faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
stuff = "stuff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stuff = ["blender/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
