name: preflight-heavy
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "examples/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/preflight.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libxi6 libxxf86vm1 libxfixes3 libgl1 libxrender1 libsm6 libegl1 libxkbcommon0 libx11-6 libglu1-mesa
      - name: Install (bpy 4.2.0 needs Python 3.11)
        run: pip install -e ".[dev]" bpy==4.2.0
      - name: Preflight Blender (4 kits, tiny Cycles CPU)
        run: python -m stuff preflight --mode blender --out reports
      - name: End-to-end with real Blender (tiny)
        run: python -m stuff make examples/mini_script.txt --voice silent --renderer blender --scale 0.25 --fps 8 --engine CYCLES --samples 2 --workdir work/blender_smoke 2>&1 | tee e2e.log
      - name: Publish report
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_report.sh preflight-blender
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libsndfile1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1
      - name: Install CPU torch first (avoids multi-GB CUDA wheels), then Chatterbox
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,tts]"
      - name: Preflight voice (load model, 2 sentences, identity metrics)
        run: python -m stuff preflight --mode voice --out reports
      - name: End-to-end with real Chatterbox voice (preview renderer)
        run: python -m stuff make examples/mini_script.txt --voice chatterbox --renderer pil --scale 0.25 --fps 10 --workdir work/voice_e2e 2>&1 | tee e2e.log
      - name: Publish report
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_report.sh preflight-voice
