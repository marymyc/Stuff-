name: engine
on:
  push:
    branches: [main]
    paths: ["engine/**", "src/stuff/planner.py", "src/stuff/align.py", ".github/workflows/engine.yml"]
  workflow_dispatch:
permissions:
  contents: write
defaults:
  run:
    shell: bash
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libsndfile1
      - name: Install (python + npm)
        run: |
          pip install -e ".[dev]"
          cd engine && npm install --no-audit --no-fund --loglevel=error
      - name: Typecheck
        run: cd engine && npx tsc --noEmit 2>&1 | tee ../tsc.log
      - name: Plan from script (silent voice)
        run: python engine/tools/make_plan.py examples/sample_script.txt --voice silent --out engine/out/plan.json 2>&1 | tee plan.log
      - name: Publish report
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in tsc.log plan.log; do [ -f "$f" ] && cp "$f" reports/ 2>/dev/null || true; done
          bash scripts/publish_report.sh engine
