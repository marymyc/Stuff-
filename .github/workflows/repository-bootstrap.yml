name: repository-bootstrap
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project files and remove bootstrap
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, io, tarfile
          from pathlib import Path
          parts = sorted(Path("bootstrap-payload").glob("part-*.txt"))
          if len(parts) != 6:
              raise SystemExit(f"Expected 6 payload parts, found {len(parts)}")
          payload = "".join(part.read_text(encoding="ascii").strip() for part in parts)
          raw = gzip.decompress(base64.b64decode(payload))
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:") as archive:
              archive.extractall(".", filter="data")
          PY
          rm -rf bootstrap-payload .github/workflows/repository-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add organized video pipeline"
          git push
